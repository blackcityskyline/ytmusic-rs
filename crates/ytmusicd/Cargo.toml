[package]
name = "ytmusicd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "YouTube Music daemon: queue, playback state and the protocol clients speak"

[features]
# The in-process audio output (decoder and sound card). Off by default: the daemon then needs
# only mpv, and the build needs no audio libraries.
native = ["dep:symphonia", "dep:symphonia-opus", "dep:cpal", "dep:rtrb"]

[dependencies]
cpal = { version = "0.18", optional = true }
rtrb = { version = "0.4", optional = true }
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "isomp4", "aac", "vorbis", "ogg", "wav", "pcm"], optional = true }
symphonia-opus = { version = "0.1", optional = true }
anyhow = "1"
bytes = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time", "sync", "process"] }
tempfile = "3"
ytmusic = { path = "../.." }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
